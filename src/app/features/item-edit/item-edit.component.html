<memo-item-form
  [heading]="strings().itemForm.editTitle"
  [title]="draft().title"
  [description]="draft().description"
  [priority]="draft().priority"
  [deadline]="draft().deadline"
  [showValue]="reportable()"
  [value]="draft().value"
  [error]="error()"
  [busy]="busy() || deleting()"
  (titleChange)="onTitle($event)"
  (descriptionChange)="onDescription($event)"
  (priorityChange)="onPriority($event)"
  (deadlineChange)="onDeadline($event)"
  (valueChange)="onValue($event)"
  (saved)="save()"
  (cancelled)="cancel()"
>
  <section class="panel" aria-labelledby="item-category-title">
    <h3 id="item-category-title">{{ strings().itemForm.categoryLabel }}</h3>
    <div class="field">
      <label for="item-category">{{ strings().itemForm.categoryLabel }}</label>
      <input id="item-category" readonly [value]="categoryName()" />
    </div>
    <hr class="divider" />
    <dl class="kv">
      <dt>{{ strings().itemForm.createdLabel }}</dt>
      <dd>{{ createdText() }}</dd>
    </dl>
  </section>
  <button type="button" class="btn btn--outlined btn--danger btn--block delete" [disabled]="busy() || deleting()" (click)="askDelete()">
    {{ strings().itemForm.delete }}
  </button>
</memo-item-form>
@if (confirming()) {
  <memo-confirm-dialog
    [heading]="strings().itemForm.deleteTitle"
    [body]="deleteBody()"
    [confirmLabel]="deleting() ? strings().itemForm.deleting : strings().itemForm.delete"
    [cancelLabel]="strings().itemForm.cancel"
    [busy]="deleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
}
