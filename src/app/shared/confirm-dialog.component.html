<button type="button" class="scrim" tabindex="-1" [attr.aria-label]="cancelLabel()" (click)="cancel()"></button>
<div
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirm-dialog-title"
  aria-describedby="confirm-dialog-body"
  (keydown)="onKeydown($event)"
>
  <h2 id="confirm-dialog-title" class="heading">{{ heading() }}</h2>
  <p id="confirm-dialog-body" class="body">{{ body() }}</p>
  <div class="actions">
    <button #cancelButton type="button" class="btn btn--text text" [disabled]="busy()" (click)="cancel()">
      {{ cancelLabel() }}
    </button>
    <button type="button" class="btn btn--text btn--danger destructive" [disabled]="busy()" (click)="confirm()">
      {{ confirmLabel() }}
    </button>
  </div>
</div>
