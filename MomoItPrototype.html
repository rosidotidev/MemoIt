<!doctype html>
<html lang="en" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MemoIt prototype</title>
<style>
/* MemoIt — Material 3 theme layer.
   Every colour role is derived from ONE accent (--hue, --c) via OKLCH tonal mapping,
   so changing the accent in Settings recolours the whole app. Scheme = light | dark. */

:root {
  --hue: 265;           /* accent hue 0-360   (set by app.js from Settings) */
  --c: 0.16;            /* accent chroma      (set by app.js from Settings) */

  /* shape */
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 999px;
  /* spacing (4-pt grid) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  /* motion */
  --ease: cubic-bezier(.2, 0, 0, 1);
  --ease-emph: cubic-bezier(.3, 0, 0, 1);
  --font: "Roboto Flex", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;

  /* ---------- LIGHT scheme (default) ---------- */
  --primary:               oklch(.48 var(--c) var(--hue));
  --on-primary:            oklch(.99 .01 var(--hue));
  --primary-container:     oklch(.92 calc(var(--c) * .45) var(--hue));
  --on-primary-container:  oklch(.27 var(--c) var(--hue));
  --secondary:             oklch(.50 calc(var(--c) * .30) var(--hue));
  --on-secondary:          oklch(.99 .005 var(--hue));
  --secondary-container:   oklch(.925 calc(var(--c) * .22) var(--hue));
  --on-secondary-container:oklch(.30 calc(var(--c) * .40) var(--hue));
  --tertiary:              oklch(.50 calc(var(--c) * .65) calc(var(--hue) + 60));
  --tertiary-container:    oklch(.92 calc(var(--c) * .35) calc(var(--hue) + 60));
  --on-tertiary-container: oklch(.28 calc(var(--c) * .70) calc(var(--hue) + 60));
  --surface:               oklch(.985 .004 var(--hue));
  --surface-dim:           oklch(.91 .008 var(--hue));
  --surface-container-lowest: oklch(1 0 0);
  --surface-container-low: oklch(.968 .006 var(--hue));
  --surface-container:     oklch(.955 .008 var(--hue));
  --surface-container-high:oklch(.94 .009 var(--hue));
  --surface-container-highest: oklch(.925 .010 var(--hue));
  --on-surface:            oklch(.22 .012 var(--hue));
  --on-surface-variant:    oklch(.45 .016 var(--hue));
  --outline:               oklch(.60 .016 var(--hue));
  --outline-variant:       oklch(.86 .012 var(--hue));
  --inverse-surface:       oklch(.30 .012 var(--hue));
  --inverse-on-surface:    oklch(.95 .006 var(--hue));
  --inverse-primary:       oklch(.80 calc(var(--c) * .8) var(--hue));
  --error:                 oklch(.52 .19 28);
  --on-error:              oklch(.99 0 0);
  --error-container:       oklch(.92 .05 28);
  --on-error-container:    oklch(.30 .12 28);
  --scrim: rgb(0 0 0 / .32);
  --shadow-1: 0 1px 2px rgb(0 0 0 / .12), 0 1px 3px 1px rgb(0 0 0 / .08);
  --shadow-3: 0 4px 8px 3px rgb(0 0 0 / .10), 0 1px 3px rgb(0 0 0 / .18);
  color-scheme: light;
}

html[data-scheme="dark"] {
  --primary:               oklch(.80 calc(var(--c) * .80) var(--hue));
  --on-primary:            oklch(.30 var(--c) var(--hue));
  --primary-container:     oklch(.38 calc(var(--c) * .80) var(--hue));
  --on-primary-container:  oklch(.92 calc(var(--c) * .30) var(--hue));
  --secondary:             oklch(.80 calc(var(--c) * .25) var(--hue));
  --on-secondary:          oklch(.30 calc(var(--c) * .30) var(--hue));
  --secondary-container:   oklch(.36 calc(var(--c) * .25) var(--hue));
  --on-secondary-container:oklch(.92 calc(var(--c) * .15) var(--hue));
  --tertiary:              oklch(.80 calc(var(--c) * .55) calc(var(--hue) + 60));
  --tertiary-container:    oklch(.36 calc(var(--c) * .45) calc(var(--hue) + 60));
  --on-tertiary-container: oklch(.92 calc(var(--c) * .25) calc(var(--hue) + 60));
  --surface:               oklch(.18 .010 var(--hue));
  --surface-dim:           oklch(.16 .010 var(--hue));
  --surface-container-lowest: oklch(.14 .010 var(--hue));
  --surface-container-low: oklch(.205 .011 var(--hue));
  --surface-container:     oklch(.225 .012 var(--hue));
  --surface-container-high:oklch(.255 .013 var(--hue));
  --surface-container-highest: oklch(.285 .014 var(--hue));
  --on-surface:            oklch(.925 .008 var(--hue));
  --on-surface-variant:    oklch(.78 .014 var(--hue));
  --outline:               oklch(.60 .014 var(--hue));
  --outline-variant:       oklch(.36 .013 var(--hue));
  --inverse-surface:       oklch(.92 .008 var(--hue));
  --inverse-on-surface:    oklch(.28 .012 var(--hue));
  --inverse-primary:       oklch(.48 var(--c) var(--hue));
  --error:                 oklch(.78 .13 28);
  --on-error:              oklch(.30 .12 28);
  --error-container:       oklch(.38 .12 28);
  --on-error-container:    oklch(.92 .05 28);
  --scrim: rgb(0 0 0 / .55);
  --shadow-1: 0 1px 2px rgb(0 0 0 / .4);
  --shadow-3: 0 4px 12px rgb(0 0 0 / .5);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 24px; letter-spacing: .03125em;
  background: var(--surface); color: var(--on-surface);
  transition: background-color .25s var(--ease), color .25s var(--ease);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: var(--r-sm); }

/* type scale (M3) */
.display { font-size: 36px; line-height: 44px; font-weight: 400; letter-spacing: 0; }
.headline { font-size: 28px; line-height: 36px; font-weight: 400; letter-spacing: 0; }
.title-lg { font-size: 22px; line-height: 28px; font-weight: 400; letter-spacing: 0; }
.title-md { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .009em; }
.body-md { font-size: 14px; line-height: 20px; letter-spacing: .018em; }
.label-lg { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .007em; }
.label-md { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .04em; }
.muted { color: var(--on-surface-variant); }

/* ---------- app shell ---------- */
.shell { min-height: 100dvh; display: flex; flex-direction: column; }
.shell__nav { display: none; }
.shell__main { flex: 1; min-width: 0; padding-bottom: 96px; }          /* room for bottom bar */
.shell__content { max-width: 720px; margin: 0 auto; padding: 0 var(--s4); }
.shell__content--wide { max-width: 1040px; }

/* bottom navigation bar (compact) */
.navbar {
  position: fixed; inset: auto 0 0 0; z-index: 20; height: 80px; display: flex; justify-content: space-around;
  padding: var(--s3) var(--s2) var(--s4); background: var(--surface-container);
}
.navbar .dest, .rail .dest, .drawer .dest { position: relative; display: flex; align-items: center; color: var(--on-surface-variant); }
.navbar .dest { flex: 1; flex-direction: column; gap: 4px; max-width: 120px; }
.dest__pill { display: grid; place-items: center; width: 64px; height: 32px; border-radius: var(--r-full); transition: background-color .2s var(--ease); }
.dest:hover .dest__pill { background: color-mix(in oklab, var(--on-surface) 8%, transparent); }
.dest[aria-current="page"] { color: var(--on-surface); }
.dest[aria-current="page"] .dest__pill { background: var(--secondary-container); color: var(--on-secondary-container); }
.dest .label-md { color: inherit; }
.dest[aria-current="page"] .label-md { font-weight: 700; }

/* navigation rail (medium) */
.rail { display: none; }
/* navigation drawer (expanded) */
.drawer__brand { display: flex; align-items: center; gap: 12px; padding: 20px 16px 12px; }
.brand-mark { width: 40px; height: 40px; border-radius: var(--r-md); background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-weight: 700; font-size: 20px; }

@media (min-width: 768px) {
  .shell { flex-direction: row; }
  .navbar { display: none; }
  .shell__main { padding-bottom: 32px; }
  .shell__content { padding: 0 var(--s5); }
  .rail {
    display: flex; flex-direction: column; align-items: center; gap: 12px; width: 80px; flex: none; padding: 44px 0 16px;
    background: var(--surface); position: sticky; top: 0; height: 100dvh;
  }
  .rail .dest { flex-direction: column; gap: 4px; width: 80px; }
  .rail .brand-mark { margin-bottom: 20px; }
  .rail__spacer { flex: 1; }
}
@media (min-width: 1200px) {
  .rail { width: 280px; align-items: stretch; padding: 12px; gap: 4px; }
  .rail .brand-mark { margin: 0; }
  .rail .dest { flex-direction: row; width: auto; height: 56px; padding: 0 16px; gap: 12px; border-radius: var(--r-full); }
  .rail .dest .dest__pill { width: auto; height: auto; background: none !important; }
  .rail .dest[aria-current="page"] { background: var(--secondary-container); color: var(--on-secondary-container); }
  .rail .dest .label-md { font-size: 14px; line-height: 20px; letter-spacing: .007em; }
  .rail .drawer__brand { padding: 20px 16px 16px; }
  .rail__section { padding: 16px 16px 8px; color: var(--on-surface-variant); }
}
.rail .drawer__brand .brand-name { display: none; }
@media (min-width: 1200px) { .rail .drawer__brand .brand-name { display: block; } }

/* ---------- top app bar ---------- */
.appbar { position: sticky; top: 0; z-index: 10; background: var(--surface); padding: 0 var(--s2); }
.appbar__row { display: flex; align-items: center; gap: var(--s1); height: 64px; }
.appbar__title { flex: 1; min-width: 0; margin: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 22px; line-height: 28px; font-weight: 400; }
.appbar--large .appbar__big { padding: 0 var(--s2) var(--s4); }
.page-title { padding: var(--s2) var(--s4) var(--s4); }
@media (min-width: 768px) { .appbar { padding: 0; } .appbar__row { padding: 0 var(--s2); } }

.icon-btn { width: 48px; height: 48px; border-radius: var(--r-full); display: grid; place-items: center; color: var(--on-surface-variant); transition: background-color .15s; flex: none; }
.icon-btn:hover { background: color-mix(in oklab, var(--on-surface-variant) 10%, transparent); }
.icon-btn:active { background: color-mix(in oklab, var(--on-surface-variant) 16%, transparent); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 24px; border-radius: var(--r-full); font-weight: 500; font-size: 14px; letter-spacing: .007em; transition: box-shadow .2s, background-color .2s; }
.btn--filled { background: var(--primary); color: var(--on-primary); }
.btn--filled:hover { box-shadow: var(--shadow-1); background: color-mix(in oklab, var(--primary) 92%, var(--on-primary)); }
.btn--tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn--outlined { border: 1px solid var(--outline); color: var(--primary); }
.btn--text { color: var(--primary); padding: 0 12px; }
.btn--text:hover, .btn--outlined:hover { background: color-mix(in oklab, var(--primary) 8%, transparent); }
.btn--danger { color: var(--error); }
.btn--block { width: 100%; height: 48px; }
.btn[disabled] { opacity: .38; pointer-events: none; }

/* FAB */
.fab { position: fixed; right: 16px; bottom: 96px; z-index: 15; height: 56px; min-width: 56px; padding: 0 20px 0 16px; display: inline-flex; align-items: center; gap: 12px; border-radius: var(--r-lg); background: var(--primary-container); color: var(--on-primary-container); box-shadow: var(--shadow-3); font-weight: 500; letter-spacing: .007em; font-size: 14px; transition: transform .2s var(--ease), box-shadow .2s; }
.fab:hover { transform: translateY(-1px); }
.fab:active { transform: scale(.97); }
@media (min-width: 768px) { .fab { bottom: 32px; right: 32px; height: 56px; } }

/* ---------- list + cards ---------- */
.section-label { padding: var(--s4) var(--s4) var(--s2); color: var(--primary); }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: var(--s4); min-height: 72px; padding: 12px var(--s4); position: relative; border-radius: var(--r-lg); }
.row--link { cursor: pointer; transition: background-color .15s; }
.row--link:hover { background: color-mix(in oklab, var(--on-surface) 6%, transparent); }
.row--link:active { background: color-mix(in oklab, var(--on-surface) 10%, transparent); }
.row__body { flex: 1; min-width: 0; }
.row__title { color: var(--on-surface); }
.row__sub { color: var(--on-surface-variant); font-size: 14px; line-height: 20px; }
.row__trail { color: var(--on-surface-variant); display: flex; align-items: center; gap: 8px; }
.avatar { width: 48px; height: 48px; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--primary-container); color: var(--on-primary-container); font-weight: 500; font-size: 18px; flex: none; }
.avatar--round { border-radius: var(--r-full); }
.badge { min-width: 28px; height: 28px; padding: 0 10px; display: inline-grid; place-items: center; border-radius: var(--r-full); background: var(--secondary-container); color: var(--on-secondary-container); font-size: 13px; font-weight: 600; }

.card { background: var(--surface-container-low); border-radius: var(--r-lg); padding: var(--s4); }
.card--elevated { background: var(--surface-container-lowest); box-shadow: var(--shadow-1); }
.card--outlined { background: var(--surface); border: 1px solid var(--outline-variant); }
.card--filled { background: var(--surface-container-highest); }

/* checkbox row (items) */
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--outline); display: grid; place-items: center; flex: none; transition: all .2s var(--ease-emph); color: transparent; }
.check svg { width: 18px; height: 18px; fill: currentColor; transform: scale(.4); transition: transform .2s var(--ease-emph); }
.item.is-done .check { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.item.is-done .check svg { transform: scale(1); }
.item.is-done .row__title { text-decoration: line-through; color: var(--on-surface-variant); }
.item.is-done .row__sub { opacity: .7; }
.item .tap { position: absolute; inset: 0; border-radius: inherit; }
.item .row__trail { position: relative; z-index: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--outline-variant); font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--on-surface-variant); background: transparent; }
.chip svg { width: 16px; height: 16px; }
.chip--overdue { background: var(--error-container); color: var(--on-error-container); border-color: transparent; }
.chip--high { background: var(--tertiary-container); color: var(--on-tertiary-container); border-color: transparent; }
.chip--sel { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; height: 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

/* ---------- text fields (outlined) ---------- */
.field { position: relative; margin: 0 0 var(--s4); }
.field input, .field textarea, .field select {
  width: 100%; font: inherit; color: var(--on-surface); background: transparent; border: 1px solid var(--outline); border-radius: var(--r-xs);
  padding: 16px; min-height: 56px; outline: none; transition: border-color .15s, box-shadow .15s; appearance: none;
}
.field textarea { min-height: 112px; resize: vertical; }
.field label { position: absolute; left: 12px; top: -9px; padding: 0 4px; background: var(--surface); font-size: 12px; line-height: 16px; color: var(--on-surface-variant); letter-spacing: .04em; }
.field input:hover, .field textarea:hover { border-color: var(--on-surface); }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.field:focus-within label { color: var(--primary); }
.field .support { margin: 4px 16px 0; font-size: 12px; line-height: 16px; color: var(--on-surface-variant); }

/* segmented button */
.segmented { display: flex; border: 1px solid var(--outline); border-radius: var(--r-full); overflow: hidden; }
.segmented button { flex: 1; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500; border-left: 1px solid var(--outline); color: var(--on-surface); transition: background-color .15s; }
.segmented button:first-child { border-left: 0; }
.segmented button[aria-pressed="true"], .segmented button[aria-checked="true"] { background: var(--secondary-container); color: var(--on-secondary-container); }
.segmented button svg { width: 18px; height: 18px; }

/* switch */
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: var(--r-full); border: 2px solid var(--outline); background: var(--surface-container-highest); transition: all .2s var(--ease); }
.switch span::after { content: ""; position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); transform: translateY(-50%); transition: all .2s var(--ease-emph); }
.switch input:checked + span { background: var(--primary); border-color: var(--primary); }
.switch input:checked + span::after { left: 24px; width: 24px; height: 24px; background: var(--on-primary); }
.switch input:focus-visible + span { outline: 3px solid var(--primary); outline-offset: 2px; }

/* ---------- dialog / menu / snackbar ---------- */
dialog { border: 0; padding: 24px; border-radius: var(--r-xl); background: var(--surface-container-high); color: var(--on-surface); max-width: 312px; width: calc(100% - 48px); box-shadow: var(--shadow-3); }
dialog::backdrop { background: var(--scrim); }
dialog h2 { margin: 0 0 16px; font-size: 24px; line-height: 32px; font-weight: 400; }
dialog p { margin: 0 0 24px; color: var(--on-surface-variant); font-size: 14px; line-height: 20px; }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.sheet { max-width: 640px; width: 100%; margin: auto auto 0; border-radius: 28px 28px 0 0; padding: 0 0 24px; }
@media (min-width: 768px) { .sheet { margin: auto; border-radius: var(--r-xl); max-width: 400px; } }
.sheet__handle { width: 32px; height: 4px; border-radius: 2px; background: var(--outline); opacity: .4; margin: 12px auto 8px; }
.sheet h2 { font-size: 16px; padding: 8px 24px; margin: 0; color: var(--on-surface-variant); font-weight: 500; }
.sheet .row { border-radius: 0; padding: 0 24px; min-height: 56px; width: 100%; text-align: left; }
.sheet .row .tick { width: 24px; color: var(--primary); }

.snackbar { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 24px); z-index: 40; opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 8px 6px 16px; width: calc(100% - 32px); max-width: 480px; border-radius: var(--r-xs); background: var(--inverse-surface); color: var(--inverse-on-surface); box-shadow: var(--shadow-3); font-size: 14px; transition: opacity .2s, transform .25s var(--ease-emph); }
.snackbar.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.snackbar span { flex: 1; }
.snackbar button { color: var(--inverse-primary); font-weight: 500; padding: 8px 12px; border-radius: var(--r-full); }
@media (min-width: 768px) { .snackbar { bottom: 24px; left: calc(50% + 40px); } }
@media (min-width: 1200px) { .snackbar { left: calc(50% + 140px); } }

/* ---------- empty state ---------- */
.empty { text-align: center; padding: 64px 32px; color: var(--on-surface-variant); }
.empty__art { width: 112px; height: 112px; margin: 0 auto 24px; border-radius: 36px; background: var(--primary-container); color: var(--on-primary-container); display: grid; place-items: center; }
.empty__art svg { width: 56px; height: 56px; }
.empty h2 { margin: 0 0 8px; color: var(--on-surface); font-weight: 400; font-size: 24px; line-height: 32px; }

/* ---------- master/detail (items) ---------- */
.split { display: block; }
.split__pane { display: none; }
@media (min-width: 1024px) {
  .split { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  .split__pane { display: block; position: sticky; top: 16px; align-self: start; max-height: calc(100dvh - 32px); overflow: auto; padding-top: 16px; }
  .split .shell__content { padding: 0; margin: 0; max-width: none; }
  .split__pane .row[aria-current="true"] { background: var(--secondary-container); color: var(--on-secondary-container); }
  .split__pane .row[aria-current="true"] .row__sub { color: inherit; opacity: .8; }
  .only-compact { display: none !important; }
}

/* ---------- settings: accent picker ---------- */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 12px; }
.swatch { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; border-radius: var(--r-md); font-size: 12px; color: var(--on-surface-variant); }
.swatch__dot { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; position: relative; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .08); transition: transform .2s var(--ease-emph); }
.swatch__dot svg { width: 24px; height: 24px; fill: currentColor; opacity: 0; transform: scale(.5); transition: all .2s var(--ease-emph); }
.swatch[aria-checked="true"] { color: var(--on-surface); font-weight: 600; }
.swatch[aria-checked="true"] .swatch__dot { transform: scale(1.08); outline: 3px solid var(--primary); outline-offset: 3px; }
.swatch[aria-checked="true"] .swatch__dot svg { opacity: 1; transform: scale(1); }
.swatch:hover .swatch__dot { transform: scale(1.06); }

/* ---------- formatting ---------- */
function dayDiff(d) { var a = new Date(d), b = new Date(); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0); return Math.round((a - b) / DAY); }
function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function wd(d) { return new Intl.DateTimeFormat(LOC(), { weekday: 'short' }).format(d); }
function whenStr(ts) {
  var d = new Date(ts), df = dayDiff(ts);
  if (df === 0) return t('Today') + ' · ' + hm(d); if (df === 1) return t('Tomorrow') + ' · ' + hm(d); if (df === -1) return t('Yesterday') + ' · ' + hm(d);
  if (Math.abs(df) < 7) return wd(d) + ' · ' + hm(d);
  return new Intl.DateTimeFormat(LOC(), { day: 'numeric', month: 'short', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }).format(d);
}
function stamp(ts) { var d = new Date(ts); return dayDiff(ts) === 0 ? t('Today') + ', ' + hm(d) : new Intl.DateTimeFormat(LOC(), { day: 'numeric', month: 'short' }).format(d) + ', ' + hm(d); }
function longDate() { var p = new Intl.DateTimeFormat(LOC(), { weekday: 'long', day: 'numeric', month: 'long' }).formatToParts(new Date()), o = {}; p.forEach(function (x) { o[x.type] = x.value; }); return o.weekday + (lang() === 'it' ? ' ' : ', ') + o.day + ' ' + o.month; }
function greeting(name) { var h = new Date().getHours(); return it_(h < 12 ? 'Good morning, ' : h < 18 ? 'Good afternoon, ' : 'Good evening, ', h < 18 ? 'Buongiorno, ' : 'Buonasera, ') + name; }
function num(n) { return new Intl.NumberFormat(LOC(), { maximumFractionDigits: 2 }).format(n); }
function toDate(ts) { var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

document.addEventListener('change', function (e) {
  var hash = (location.hash.replace(/^#\/?/, '')).split('/');
  if (e.target.id === 'rep') { catById(hash[1]).reportable = e.target.checked; }
  if (e.target.id === 'cat' && hash[0] === 'report') { S.ui.rcat = e.target.value; rerender(); }
});
document.addEventListener('submit', function (e) {
  var f = e.target;
  if (f.id === 'loginForm') {
    e.preventDefault(); var u = $('email').value.trim().toLowerCase(), key = u === 'bob@example.com' ? 'admin' : u, rec = DB.users[key];
    if (rec && rec.password === $('pwd').value) { rec.theme.lang = theme.lang; S.user = key; theme = rec.theme; S.loginErr = false;
      items().forEach(function (i) { if (i.demo) i.deadline = Date.now() + 60000; if (i.deadline && i.deadline <= Date.now()) alerted[akey(i)] = 1; }); S.cur = ''; location.hash = '#/categories'; route(); }
    else { S.loginErr = true; route(); $('email').value = u; $('pwd').focus(); }
  } else if (f.id === 'newcatForm' && e.submitter && e.submitter.value === 'ok') {
    var name = $('nc-name').value, err = validName(name);
    if (err) { e.preventDefault(); var s = $('nc-sup'); s.textContent = err; s.classList.add('is-error'); $('nc-name').parentNode.classList.add('is-bad'); return; }
    cats().push({ id: nid('c'), name: name.trim(), state: 'Done', reportable: false, created: Date.now() }); setTimeout(function () { rerender(); snack(t('Category created')); }, 0);
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !$('acct-menu').hidden) closeMenu(true);
  var row = e.target.closest && e.target.closest('.row[role=button]'); if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); row.click(); }
});
window.addEventListener('resize', function () { closeMenu(false); });

applyTheme();
if (!location.hash) location.hash = '#/login'; else route();
})();
</script>
</body>
</html>
